<!doctype html>
<!-- SK-HUB -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mini-SK-3</title>
  <style>
    :root{--bg:#0f1420;--card:#171e30;--line:#263048;--tx:#e6ebf5;--mut:#8a96b0;color-scheme:dark}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) 0 24px}
    header{position:sticky;top:0;background:rgba(15,20,32,.92);backdrop-filter:blur(8px);padding:14px 16px 10px;z-index:2;border-bottom:1px solid var(--line)}
    h1{margin:0 0 10px;font-size:20px}
    input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:#0b0f18;color:var(--tx);font:inherit}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:14px;padding:16px}
    a.app{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:var(--tx);padding:12px 6px;border-radius:14px}
    a.app:hover,a.app:focus{background:var(--card);outline:none}
    .ic{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;font-weight:800;font-size:24px;color:#fff;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.35)}
    .ic img{width:100%;height:100%;object-fit:cover}
    .nm{font-size:13px;text-align:center;line-height:1.25;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .ds{font-size:11px;color:var(--mut);text-align:center}
    .vazio{color:var(--mut);padding:30px 16px;text-align:center}
    .rec{padding:0 16px;color:var(--mut);font-size:12px;margin-top:10px}
  </style>
  <!-- PWA:inicio (gerado pelo Mini SK — pode refazer no painel 📱 PWA) -->
  <link rel="manifest" href="hub.webmanifest">
  <meta name="theme-color" content="#0f1420">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mini-SK-3">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script>
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      addEventListener('load', function () { navigator.serviceWorker.register('service-worker.js').catch(function (e) { console.warn('Service worker:', e); }); });
    }
  </script>
  <!-- PWA:fim -->
</head>
<body>
  <header><h1>Mini-SK-3</h1><input id="q" type="search" placeholder="Procurar entre 1 apps…" autocomplete="off"></header>
  <div class="rec" id="rec"></div>
  <main class="grid" id="g"></main>
  <script>
    // Lista gravada pelo Mini SK — não depende do navegador, funciona em qualquer celular.
    var APPS = [
 {
  "n": "Mini SK",
  "d": "",
  "u": "index.html",
  "i": "",
  "c": "hsl(241 62% 48%)",
  "l": "MS"
 }
];
    var g = document.getElementById('g'), q = document.getElementById('q');
    function rec(){ try { return JSON.parse(localStorage.getItem('hub-recentes') || '[]'); } catch (e) { return []; } }
    function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
    function card(a){ return '<a class="app" href="' + esc(a.u) + '" data-u="' + esc(a.u) + '"><span class="ic" style="background:' + a.c + '">' + (a.i ? '<img src="' + esc(a.i) + '" alt="" loading="lazy" onerror="this.remove()">' : '') + (a.i ? '' : esc(a.l)) + '</span><span class="nm">' + esc(a.n) + '</span>' + (a.d ? '<span class="ds">' + esc(a.d) + '</span>' : '') + '</a>'; }
    function show(){ var t = q.value.trim().toLowerCase(); var r = rec(); var list = APPS.filter(function(a){ return !t || (a.n + ' ' + a.d + ' ' + a.u).toLowerCase().indexOf(t) >= 0; });
      if (!t) list.sort(function(a,b){ var x = r.indexOf(a.u), y = r.indexOf(b.u); return (x < 0 ? 999 : x) - (y < 0 ? 999 : y); });
      g.innerHTML = list.map(card).join('') || '<p class="vazio">Nada encontrado.</p>'; document.getElementById('rec').textContent = !t && r.length ? 'Os usados por último aparecem primeiro.' : ''; }
    g.addEventListener('click', function(e){ var a = e.target.closest('a.app'); if (!a) return; var r = rec().filter(function(u){ return u !== a.dataset.u; }); r.unshift(a.dataset.u); try { localStorage.setItem('hub-recentes', JSON.stringify(r.slice(0, 30))); } catch (e) {} });
    q.addEventListener('input', show); show();
  </script>
</body>
</html>
